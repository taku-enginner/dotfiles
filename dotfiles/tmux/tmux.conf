# ------------------------
# Prefix
# ------------------------
unbind-key C-b                             # デフォルトのprefix(C-b)を解除
set -g prefix C-d                          # prefixをC-dに変更
bind C-d send-prefix                       # C-dを押したときにprefixとして送る

# ------------------------
# 基本キーバインド
# ------------------------
bind : command-prompt                      # :でコマンドプロンプトを開く
bind Escape copy-mode                      # Escapeでコピーモードに入る（viモード推奨）

# ------------------------
# イベント設定
# ------------------------
set -g focus-events on                     # フォーカスイベントを有効化

# ------------------------
# ターミナルと互換性
# ------------------------
set -g default-terminal 'screen-256color'  # 256色対応ターミナル設定
set -ga terminal-overrides ',xterm-256color:RGB'  # RGBカラー有効化

# ------------------------
# 操作設定
# ------------------------
setw -g mode-keys vi                       # viライクなキーバインドに設定
setw -g xterm-keys on                      # xtermキーボード互換モード
set -g escape-time 0                       # ESCキー後の待ち時間を0に
set -g history-limit 10000                # 履歴の最大保存数
set -g display-time 4000                  # ステータスメッセージの表示時間（ミリ秒）
set -g renumber-windows on                # ウィンドウ番号の再割り当て

# ------------------------
# マウス操作
# ------------------------
set -g mouse on                            # マウス操作を有効化

# ------------------------
# クリップボード
# ------------------------
set -g set-clipboard on                    # システムクリップボードと連携（tmux 3.2以降）

# ------------------------
# ステータスライン設定
# ------------------------
set -g status on                           # ステータスラインを表示
set -g status-interval 5                   # ステータスの更新間隔（秒）
set -g status-justify left                 # ウィンドウ一覧を左詰めに表示
set -g status-fg 'colour15'                # ステータス文字色
set -g status-bg 'colour244'               # ステータス背景色
set -g status-left '#[bg=colour26,fg=colour231] #(whoami)@#H #[default]'  # 左側にユーザー名とホスト表示
set -g status-right "#[fg=colour237,bg=colour15] %Y-%m-%d(%a) %H:%M "     # 右側に日時を表示
set -g window-status-current-style fg=colour230,bg=colour202             # アクティブウィンドウの色
setw -g status-left-length 100             # 左側の最大長
setw -g window-status-current-format " #I:#W " # アクティブウィンドウのフォーマット
setw -g window-status-format "#I:#W"       # 通常ウィンドウのフォーマット
set -g visual-activity on                  # アクティビティをステータスで通知

# ------------------------
# ウィンドウ全体のスタイル
# ------------------------
#set -g window-style 'bg=#000000'           # 非アクティブウィンドウ背景色
#set -g window-active-style 'bg=#26292c'    # アクティブウィンドウ背景色

# ------------------------
# メッセージのスタイル
# ------------------------
set -g message-style fg=colour214,bg=colour244  # ステータスメッセージの色

# ------------------------
# ウィンドウ移動・新規作成
# ------------------------
bind C-n next-window                       # C-nで次のウィンドウへ
bind C-p previous-window                   # C-pで前のウィンドウへ
bind C-c new-window                        # C-cで新しいウィンドウを開く

# ------------------------
# コンフィグのリロード
# ------------------------
bind r source-file /home/tak/.config/tmux/tmux.conf \; display-message 'Reloaded Config!!'  # rで設定ファイルを再読み込み

# ------------------------
# ペインのリサイズ
# ------------------------
bind -r < resize-pane -L 1                 # <で左にリサイズ
bind -r > resize-pane -R 1                 # >で右にリサイズ
bind -r - resize-pane -D 1                 # -で下にリサイズ
bind -r + resize-pane -U 1                 # +で上にリサイズ

# ------------------------
# ペイン分割（カレントディレクトリを維持）
# ------------------------
bind c new-window -c '#{pane_current_path}'      # 新しいウィンドウ（カレント維持）
bind | split-window -h -c '#{pane_current_path}' # | で縦分割（左右）
bind - split-window -v -c '#{pane_current_path}' # - で横分割（上下）

# ------------------------
# ペイン番号表示
# ------------------------
bind C-z display-panes                      # C-zでペイン番号を表示（prefixと被らないよう注意）

# ------------------------
# ペインのシンクロ
# ------------------------
bind s setw synchronize-panes on            # sでシンクロ開始
bind S setw synchronize-panes off           # Sでシンクロ解除

# ------------------------
# ウィンドウ・ペインの番号設定
# ------------------------
set -g base-index 1                         # ウィンドウ番号を1始まりに
setw -g pane-base-index 1                   # ペイン番号も1始まりに

# ------------------------
# 自動リネーム無効化
# ------------------------
setw -g automatic-rename off                # ウィンドウ名の自動変更を無効に

# ------------------------
# ペインの枠スタイル
# ------------------------
setw -g pane-active-border-style fg=colour202     # アクティブペインの枠色
setw -g pane-border-status top                    # ペイン番号を上部に表示
setw -g pane-border-format " #{pane_index} "      # 表示するペイン番号のフォーマット
