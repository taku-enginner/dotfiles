# ------------------------
# Prefix
# ------------------------
unbind-key C-b
set -g prefix C-Space
bind C-Space send-prefix

# ------------------------
# 基本キーバインド
# ------------------------
bind : command-prompt
bind Escape copy-mode

# ------------------------
# イベント設定
# ------------------------
set -g focus-events on

# ------------------------
# ターミナルと互換性
# ------------------------
set -g default-terminal 'screen-256color'
set -ga terminal-overrides ',xterm-256color:RGB'

# image.nvim(kitty backend)が画像を tmux 越しに送るための passthrough
# (kitty backend は graphics シーケンスを DCS passthrough でラップするため必須)
set -gq allow-passthrough on

# ------------------------
# 操作設定
# ------------------------
setw -g mode-keys vi
setw -g xterm-keys on
set -g escape-time 0
set -g history-limit 10000
set -g display-time 4000
set -g renumber-windows on

# ------------------------
# マウス操作
# ------------------------
set -g mouse on

# ------------------------
# クリップボード（環境別対応）
# ------------------------
set -g set-clipboard on

# デフォルト: OSC 52（Debianサーバー・ヘッドレス）
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# macOS
if-shell 'uname | grep -q Darwin' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# Linux X11
if-shell '[ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# Linux Wayland
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# WSL（X11/Wayland より後で上書き）
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
}

# ------------------------
# ステータスライン設定
# ------------------------
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-fg 'colour15'
set -g status-bg 'colour244'
set -g status-left '#[bg=colour26,fg=colour231] #(whoami)@#H #[default]'
set -g status-right "#[fg=colour237,bg=colour15] %Y-%m-%d(%a) %H:%M "
set -g window-status-current-style fg=colour230,bg=colour202
setw -g status-left-length 100
setw -g window-status-current-format " #I:#W "
setw -g window-status-format "#I:#W"
set -g visual-activity on

# ------------------------
# メッセージのスタイル
# ------------------------
set -g message-style fg=colour214,bg=colour244

# ------------------------
# ウィンドウ移動・新規作成
# ------------------------
bind C-n next-window
bind C-p previous-window
bind C-c new-window

# ------------------------
# コンフィグのリロード
# ------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloaded Config!!'

# ------------------------
# ペイン分割（カレントディレクトリ維持）
# ------------------------
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# ------------------------
# ウィンドウ・ペイン番号
# ------------------------
set -g base-index 1
setw -g pane-base-index 1

# ------------------------
# 自動リネーム無効
# ------------------------
setw -g automatic-rename off

# ------------------------
# ペイン枠スタイル
# ------------------------
setw -g pane-active-border-style fg=colour202
setw -g pane-border-status top
setw -g pane-border-format " #{pane_index} "
