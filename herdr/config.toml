onboarding = false
# ~/.config/herdr/config.toml

[keys]
prefix           = "ctrl+space"
help             = ""              # ネイティブ help を無効化し、prefix+? を下の popup 一覧に譲る
next_tab         = "prefix+ctrl+n"
previous_tab     = "prefix+ctrl+p"
# 新規タブ・分割は下の [[keys.command]] で mirror のリモート版に割り当てている。
# ミラー外では herdr のローカル動作に degrade するので、体感は今までと同じ。
# ここに残すのは「ミラー内でも明示的にローカルへ作りたい」時の退避キー(プラグイン無効時の保険も兼ねる)。
new_tab          = "prefix+ctrl+c"       # ローカルタブ(tmux の bind C-c 相当・従来どおり)
split_vertical   = "prefix+shift+v"      # ローカル左右分割
split_horizontal = "prefix+shift+minus"  # ローカル上下分割

# prefix+i: Claude Code のペインの右隣に、プロンプト下書き用の nvim ペインを開く。
# Claude の Ctrl-G は外部エディタ起動時に claude 自身が画面をクリアするため会話が見えない。
# こちらは Claude を生かしたまま分割するので、左=会話 / 右=nvim で書ける。
# 書いた本文は nvim 側の <leader>cc(:CcSend)で Claude の入力欄へ送る。
[[keys.command]]
key     = "prefix+i"
type    = "shell"        # detached 実行。cc-compose は herdr API を叩くだけで TTY を持たない
command = "cc-compose"   # ~/.local/bin(setup.sh が symlink・herdr server の PATH に含まれる)

# herdr-mirror(plugin id: mirror): リモート herdr の workspace/agent を
# ローカルのサイドバーにミラーする。対象ホストは
# ~/.config/herdr/plugins/config/mirror/hosts.toml で定義(このリポジトリは公開なので追跡しない)。
# workspace.focused イベントで自動起動するため通常は start を打つ必要はない。
# 既定キーと衝突しないものを選択(既定の settings=prefix+s / close_workspace=prefix+shift+d とは別キー)。
[[keys.command]]
key     = "prefix+shift+m"
type    = "plugin_action"
command = "mirror.start"          # daemon 起動 / 再開

[[keys.command]]
key     = "prefix+shift+s"
type    = "plugin_action"
command = "mirror.pause"          # 同期停止(ミラーは残る)

[[keys.command]]
key     = "prefix+alt+d"
type    = "plugin_action"
command = "mirror.teardown"       # daemon 停止 + ミラー全消し

[[keys.command]]
key     = "prefix+shift+b"
type    = "plugin_action"
command = "mirror.restore"        # ローカルで閉じたミラーを復帰(既定の toggle_sidebar=prefix+b とは別キー)

# リモート側にオブジェクトを作る。ミラー外で呼ぶとローカルの同等動作に degrade するので
# 誤爆しない。キーは「ネイティブキー + alt」で対応付ける(README 推奨)。
[[keys.command]]
key     = "prefix+alt+n"
type    = "plugin_action"
command = "mirror.remote-new-workspace"   # native new_workspace = prefix+shift+n

# タブ作成・分割は tmux 慣習のキーをそのままリモート版に渡す。
# ミラー内 → リモートに作られて数秒でミラーされる / ミラー外 → ローカルに作られる。
# (ミラーワークスペース内の非ミラーペインで分割した場合だけはエラーになる。
#  ミラーのレイアウトがリモートとズレるのを防ぐための仕様)
[[keys.command]]
key     = "prefix+c"
type    = "plugin_action"
command = "mirror.remote-new-tab"

[[keys.command]]
key     = "prefix+v"
type    = "plugin_action"
command = "mirror.remote-split-right"

[[keys.command]]
key     = "prefix+|"
type    = "plugin_action"
command = "mirror.remote-split-right"

[[keys.command]]
key     = "prefix+minus"
type    = "plugin_action"
command = "mirror.remote-split-down"

# prefix+alt+r: reviewr(persiyanov.reviewr)のサイドバーをトグルする。
# reviewr はマシン境界を越えられない(サイドバーはそのマシンのバイナリをリポの cwd で
# 起動し、agent 解決も行コメント書き込みも同じマシンの herdr API を使う)。一方 prefix キーは
# ミラーペインでもローカルの herdr が食うため、ローカルのアクションを直接割り当てると
# 画面に映っているリモートのレビューは開かない。reviewr-toggle が押した場所を見て
# 「ミラー内 → そのホストの herdr へ ssh 越しに invoke / ミラー外 → ローカルへ invoke」に振り分ける。
# ネイティブの resize_mode=prefix+r・reload_config=prefix+shift+r とは別キー。
[[keys.command]]
key     = "prefix+alt+r"
type    = "shell"        # detached 実行。失敗は ~/.local/state/herdr-mirror/reviewr-toggle.log
command = "reviewr-toggle"

# prefix+?: キーバインド一覧。ネイティブ help(同キー)はオーバーレイが狭くて読みにくいため、
# 画面ほぼ全面の popup で herdr-keys(config.toml と --default-config から生成)を less で開く。
[[keys.command]]
key     = "prefix+?"
type    = "popup"
command = "herdr-keys"
width   = "95%"
height  = "90%"

# herdr-lazy(plugin id: herdr-lazy): プラグイン構成を plugins.list で宣言し、lock で固定して
# 別マシンに再現する。list/lock の置き場所は .zshrc の HERDR_LAZY_LIST で dotfiles 側に寄せてある。
# 管理ペインでは a キーで「list に載っていない導入済みプラグイン」を list に取り込める。
# ghzinga(dutifuldev.ghzinga)だけは owner/repo/subdir 形式で list が対応しないため、
# 従来どおり setup.sh の herdr_plugins 一覧が面倒を見る。
# 既定バインドと衝突しないことを確認済み(prefix+shift+l は未使用)。
[[keys.command]]
key     = "prefix+shift+l"
type    = "plugin_action"
command = "herdr-lazy.manage"

[ui.toast]
delivery      = "terminal"
delay_seconds = 0

# サイドバー agents 欄の行構成。
# 既定は [["state_icon","workspace","tab"],["agent"]] だが、ワーク名は spaces 欄に
# 出ているので agents 欄では重複。外して1行目を state_icon + tab のみにする。
[ui.sidebar.agents]
rows = [["state_icon", "tab"], ["agent"]]

# claude ペインだけ1行に上書きする。
# - agent 行は rows_by_agent.claude に置いている時点で常に "claude" 固定の死に行なので捨てる
# - tab も捨てる。keys.indexed.tabs 未設定で番号直打ちのタブ切替をしていないため表示価値が低い
# - 残すのは terminal_title_stripped。/rename 済みならセッション名、未 rename なら
#   Claude Code の自動タイトル(会話に応じて変動)が出る。どちらも workspace + tab より識別性が高い
# - state_icon に dim は付けない。herdr は状態ごとにアイコンの色を出し分ける
#   (working=スピナー / idle=✓ / blocked)ので、薄くすると動作中の手がかりが弱まる
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, fg = "#7dcfff" }],
]

[theme]
name = "tokyo-night"
auto_switch = false
[experimental]
allow_nested = true

# サイドバーの各ワークスペースに描く行。ここを書くと herdr の既定行を丸ごと
# 上書きするので、先頭 2 行(名前・ブランチ)で既定の見た目を再現している。
# $ で始まるトークンは `herdr workspace report-metadata` が入れた値で埋まる。
# 値の無いトークンの行は描かれない。書き手は bin/herdr-ticker。
#
# 値を入れるのは専用ワークスペース notify だけなので、通知系の 9 行が出るのも
# notify のブロックだけ。notify は herdr-ticker が無ければ自動で作る。
# $sep は先頭と末尾の 2 箇所に置いて notify のブロックを線で挟む(値は同じ)。
[ui.sidebar.spaces]
rows = [
  [{ token = "$sep", fg = "#5c6370" }],     # notify の直上に引く区切り線
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$artist", fg = "#00B16B" }],  # 再生中のアーティスト
  [{ token = "$title",  fg = "#84C98B" }],  # 再生中の曲名
  [{ token = "$gmail",  fg = "#ff8c00" }],  # Gmail 未読件数
  [{ token = "$slack",  fg = "#E01E5A" }],  # Slack のラベル行(アーカイブ済み件数を兼ねる)
  [{ token = "$slack1", fg = "#E8A0B4" }],  # 以下メンションのあるチャネル
  [{ token = "$slack2", fg = "#E8A0B4" }],
  [{ token = "$slack3", fg = "#E8A0B4" }],
  [{ token = "$slack4", fg = "#E8A0B4" }],
  [{ token = "$slack5", fg = "#E8A0B4" }],
  [{ token = "$sep", fg = "#5c6370" }],     # notify の直下に引く区切り線
]

# エージェントパネルの各行。既定は ["state_icon", "workspace", "tab"] / ["agent"] で
# space 名が出るが、同じ space に複数セッションがあると見分けが付かないので
# セッション名(Claude が端末タイトルに出している要約)に差し替える。
#   pane                    … herdr-mirror が pane.report_metadata --title で送ってくる
#                             リモート側のセッション名。ローカルのペインでは
#                             リネームしない限り空なので何も描かれない。
#   terminal_title_stripped … ローカルの Claude のセッション名。
# state_icon は既定のまま残すので、進行中(⠹)・応答待ち(◉)の表示は今までどおり。
# セッション名は既定だと dim + #6C7086 で背景(#1E1E2E)に埋もれるため、
# spaces パネルのワークスペース名と同じ bold + #CDD6F4 に上げる。
# 2 行目の space 名はセッション名の従属情報なので、1 段落とした #A6ADC8 で描く
# (既定の dim + #6C7086 は暗すぎる)。
[ui.sidebar.agents]
# エージェント 1 件が 2 行になったぶん、既定の row_gap = 0 だと隣の行と続いて見える。
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "pane",                    fg = "#CDD6F4", bold = true, dim = false },
    { token = "terminal_title_stripped", fg = "#CDD6F4", bold = true, dim = false },
  ],
  [{ token = "workspace", fg = "#A6ADC8", bold = false, dim = false }],
]
